<script>
const categories=['होम','महाराष्ट्र','शहर','देश-विदेश','क्रीडा','राजकारण','विचारमंच','विश्लेषण','आरोग्य','अर्थकारण','मनोरंजन','शेती','शिक्षण','लाईफस्टाईल','फोटो'];
const images={farm:'1500382017468-9049fed747ef',city:'1519501025264-65ba15a82390',train:'1474487548417-781cb71495f3',money:'1611974789855-9c2a0a7236a3',health:'1576091160399-112ba8d25d1d',sport:'1531415074968-036ba1b575da',school:'1503676260728-1c00da094a0b',water:'1433086966358-54859d0ed716',film:'1489599849927-2ee91cede3ba',tech:'1518770660439-4636190af475',food:'1490645935967-10de6ba17061',world:'1526778548025-fa2f459cd5c1'};
const raw=[['शेती','पाणी, माती आणि मेहनत; मराठवाड्यातील शेतीच्या विकासासाठी नव्या संधी','farm'],['महाराष्ट्र','ग्रामीण भागाच्या विकासासाठी पाणी व्यवस्थापनाचे महत्त्व काय?','water'],['शहर','शहरातील सार्वजनिक वाहतूक अधिक सुलभ कशी होऊ शकते?','train'],['अर्थकारण','बचत आणि गुंतवणूक करताना या गोष्टी लक्षात ठेवा','money'],['शिक्षण','विद्यार्थ्यांसाठी कौशल्य विकासाची गरज आणि नव्या संधी','school'],['आरोग्य','निरोगी जीवनशैलीसाठी रोजच्या सवयींमध्ये कोणते बदल करावेत?','health'],['क्रीडा','मैदानी खेळांची आवड वाढवण्यासाठी स्थानिक पातळीवर काय करता येईल?','sport'],['देश-विदेश','जगभरातील शहरांमध्ये शाश्वत विकासाला का मिळतेय महत्त्व?','world'],['मनोरंजन','मराठी चित्रपटांची बदलती वाटचाल; प्रेक्षकांच्या आवडीनिवडींचा आढावा','film'],['विश्लेषण','तंत्रज्ञानाचा ग्रामीण अर्थव्यवस्थेवर होणारा परिणाम समजून घ्या','tech'],['राजकारण','स्थानिक स्वराज्य संस्थांच्या कामात नागरिकांचा सहभाग का आवश्यक?','city'],['लाईफस्टाईल','संतुलित आहार आणि नियमित व्यायामाचे फायदे','food'],['शेती','मृद व जलसंधारणामुळे शेतीला कसा मिळतो आधार?','farm'],['महाराष्ट्र','ग्रामविकासात महिला बचत गटांची महत्त्वाची भूमिका','school'],['शहर','वाहतूक कोंडी कमी करण्यासाठी शहर नियोजनात कोणत्या बाबी महत्त्वाच्या?','city'],['अर्थकारण','घरगुती आर्थिक नियोजन करताना खर्चाची नोंद कशी ठेवावी?','money'],['मनोरंजन','रंगभूमी आणि सिनेमा; मराठी कलाविश्वातील वेगवेगळे प्रवाह','film'],['क्रीडा','खेळाडूंना प्रशिक्षण आणि मूलभूत सुविधांची गरज','sport'],['शिक्षण','डिजिटल शिक्षणामुळे विद्यार्थ्यांना मिळणाऱ्या संधी','tech'],['विचारमंच','गावाचा विकास ही सर्वांची सामूहिक जबाबदारी','farm'],['देश-विदेश','पर्यावरण संरक्षणासाठी स्थानिक प्रयत्नांचे जागतिक महत्त्व','world'],['आरोग्य','दैनंदिन जीवनात पाण्याचे महत्त्व आणि योग्य काळजी','water'],['राजकारण','लोकशाहीत जनसहभाग आणि स्थानिक प्रश्नांचे महत्त्व','city'],['शेती','सेंद्रिय शेती आणि बाजारपेठेतील संधींची माहिती','farm'],['फोटो','निसर्ग आणि ग्रामीण जीवनाची झलक','farm']];
const stories=raw.map(([cat,title,img],i)=>({id:i+1,cat,title,img,body:`${title}. या विषयाकडे विविध अंगांनी पाहणे आवश्यक आहे. स्थानिक परिस्थिती, उपलब्ध साधने आणि नागरिकांचा सहभाग यांचा विचार केल्यास अधिक योग्य निर्णय घेता येतात.\n\nया विषयाची सविस्तर माहिती, अधिकृत संदर्भ आणि संबंधित व्यक्तींच्या प्रतिक्रिया येथे संपादकीय टीम प्रकाशित करू शकते. हा केवळ वेबसाइटच्या मांडणीचा नमुना मजकूर आहे.`}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const linkCat=c=>c==='होम'?'#home':'#category/'+encodeURIComponent(c);const photo=s=>`<img class="photo" src="https://images.unsplash.com/photo-${images[s.img]}?auto=format&fit=crop&w=900&q=75" alt="${esc(s.cat)} — प्रतिनिधिक छायाचित्र" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22800%22 height=%22450%22%3E%3Crect width=%22800%22 height=%22450%22 fill=%22%23e5e7e9%22/%3E%3Cpath d=%22M0 450L230 170 390 340 520 210 800 450%22 fill=%22%23b7bec5%22/%3E%3Ccircle cx=%22660%22 cy=%22110%22 r=%2250%22 fill=%22%23cbd1d6%22/%3E%3C/svg%3E'">`;const href=s=>'#news/'+s.id;const cat=s=>`<div class="category">${esc(s.cat)}</div>`;const tile=s=>`<article class="tile"><a href="${href(s)}">${photo(s)}${cat(s)}<h3>${esc(s.title)}</h3></a></article>`;const small=s=>`<article class="small-card"><a href="${href(s)}">${cat(s)}<h3>${esc(s.title)}</h3></a><a href="${href(s)}">${photo(s)}</a></article>`;const section=(c,ss)=>`<section class="section"><div class="section-head"><h2>${esc(c)}</h2><a href="${linkCat(c)}">अधिक वाचा ›</a></div><div class="section-grid">${ss.map(tile).join('')}</div></section>`;
const nav=document.querySelector('#nav'),view=document.querySelector('#view');nav.innerHTML=categories.map(c=>`<a href="${linkCat(c)}">${c}</a>`).join('');document.querySelector('#menuPanel').innerHTML=nav.innerHTML;document.querySelector('#footlinks').innerHTML=nav.innerHTML;document.querySelector('#date').textContent=new Intl.DateTimeFormat('mr-IN',{dateStyle:'long'}).format(new Date());
function home(){return `<div class="ad">जाहिरात</div><div class="breadcrumb">मराठी बातम्या</div><div class="lead-grid"><div><a href="${href(stories[0])}">${photo(stories[0])}${cat(stories[0])}<h1 class="lead-title">${stories[0].title}</h1></a><div class="demo">विशेष लेख · संपादकीय नमुना</div></div><div class="middle">${stories.slice(1,5).map(small).join('')}</div><div class="right"><div class="ad">जाहिरात</div><h2 class="right-title">ताज्या बातम्या</h2>${stories.slice(5,9).map(small).join('')}</div></div><div class="four">${stories.slice(9,13).map(tile).join('')}</div>${section('महाराष्ट्र',[stories[1],stories[13],stories[14],stories[22]])}${section('शेती',[stories[0],stories[12],stories[23],stories[19]])}${section('मनोरंजन',[stories[8],stories[16],stories[11],stories[9]])}${section('अर्थकारण',[stories[3],stories[15],stories[18],stories[10]])}${section('क्रीडा',[stories[6],stories[17],stories[4],stories[5]])}${section('शिक्षण आणि आरोग्य',[stories[4],stories[5],stories[18],stories[21]])}<p class="demo">डेमो: सर्व मथळे आणि मजकूर मांडणी तपासण्यासाठी आहेत. छायाचित्रे प्रतिनिधिक आहेत.</p>`}
function list(title,ss){return `<div class="breadcrumb"><a href="#home">होम</a> › ${esc(title)}</div><section class="section"><div class="section-head"><h2>${esc(title)}</h2></div>${ss.length?`<div class="four">${ss.map(tile).join('')}</div>`:'<div class="empty">बातम्या सापडल्या नाहीत.</div>'}</section>`}
function article(s){return `<article class="article"><a class="back" href="#home">‹ मुख्यपृष्ठ</a><div class="breadcrumb">होम › <a href="${linkCat(s.cat)}">${s.cat}</a></div>${cat(s)}<h1>${esc(s.title)}</h1><div class="meta">मराठी वार्ता · नमुना लेख</div>${photo(s)}<div class="meta">प्रतिनिधिक छायाचित्र</div>${s.body.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}<div class="share"><button id="wa">WhatsApp</button><button id="copy">लिंक कॉपी करा</button></div><div class="demo">हा प्रत्यक्ष वार्तांकन नसून मांडणीचा नमुना आहे.</div></article>${section('आणखी वाचा',stories.filter(x=>x.id!==s.id).slice(0,4))}`}
function render(){const [kind,value]=location.hash.slice(1).split('/');let current='होम';if(kind==='news'){const s=stories.find(x=>x.id===Number(value));view.innerHTML=s?article(s):list('बातमी उपलब्ध नाही',[]);current=s?.cat||'होम';document.title=s?`${s.title} | मराठी वार्ता`:'मराठी वार्ता';document.querySelector('#wa')?.addEventListener('click',()=>window.open('https://wa.me/?text='+encodeURIComponent(s.title+' '+location.href),'_blank','noopener'));document.querySelector('#copy')?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent='लिंक कॉपी झाली'}catch{prompt('बातमीची लिंक',location.href)}})}else if(kind==='category'){current=decodeURIComponent(value||'');view.innerHTML=list(current,current==='ताज्या बातम्या'?stories:stories.filter(s=>s.cat===current));document.title=current+' | मराठी वार्ता'}else if(kind==='search'){const q=decodeURIComponent(value||'');view.innerHTML=list('शोध: '+q,stories.filter(s=>(s.title+' '+s.cat).includes(q)))}else{view.innerHTML=home();document.title='मराठी वार्ता | मराठी बातम्या'}nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.textContent===current));document.querySelector('#menuPanel').classList.remove('open');window.scrollTo(0,0)}window.addEventListener('hashchange',render);document.querySelector('#searchBtn').onclick=()=>{document.querySelector('#searchbar').classList.toggle('open');document.querySelector('#search').focus()};document.querySelector('#menuBtn').onclick=()=>document.querySelector('#menuPanel').classList.toggle('open');document.querySelector('#searchbar').onsubmit=e=>{e.preventDefault();location.hash='#search/'+encodeURIComponent(document.querySelector('#search').value.trim())};render();
</script></body></html>
