function formatText(s){let t=plain(s).replace(/\r/g,"");const inline=x=>{let y=esc(x);y=y.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,"<em>$1</em>");return y};let out=[],buf=[],list=[];const flush=()=>{if(buf.length){out.push("<p>"+buf.map(inline).join("<br>")+"</p>");buf=[]}if(list.length){out.push("<ul>"+list.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");list=[]}};for(let l of t.split("\n")){l=l.trim();if(!l){flush();continue}if(/^[-*]\s+/.test(l)){if(buf.length)flush();list.push(l.replace(/^[-*]\s+/,""));continue}if(list.length)flush();if(/^#{1,6}\s/.test(l)){flush();out.push("<h2>"+inline(l.replace(/^#{1,6}\s+/,""))+"</h2>")}else if(/^>\s?/.test(l)){buf.push(l.replace(/^>\s?/,""))}else if(/^!\[.*\]\(.*\)$/.test(l)){flush();let m=l.match(/^!\[(.*?)\]\((.*?)\)$/),u=url(m?.[2]);if(u)out.push('<img class="inlineimage" loading="lazy" src="'+esc(u)+'" alt="'+esc(m[1])+'">')}else buf.push(l)}flush();return out.join("")}
